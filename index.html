<!DOCTYPE html>
<html>
<head>
    <title>OpenMATB SYSMON (Corrected)</title>
    <style>
        body { background: #1a1a1a; color: white; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; overflow: hidden; }
        #container { border: 2px solid #444; padding: 20px; background: #000; position: relative; width: 500px; height: 450px; box-shadow: 0 0 20px rgba(0,0,0,0.5); }
        .label { position: absolute; font-size: 14px; color: #00ff00; text-align: center; font-weight: bold; }
        
        /* 2 Status Lights at the Top */
        .light { width: 60px; height: 40px; border: 2px solid #333; position: absolute; }
        .light.green { background: #006600; border-color: #00ff00; } /* Normal: Green ON */
        .light.red { background: #660000; border-color: #ff0000; }   /* Normal: Red OFF */
        .light.active-green { background: #00ff00; box-shadow: 0 0 15px #00ff00; }
        .light.active-red { background: #ff0000; box-shadow: 0 0 15px #ff0000; }
        .light-off { background: #111; border-color: #333; }

        /* 4 Vertical Scales */
        .scale-track { width: 12px; height: 250px; border: 1px solid #666; position: absolute; background: #111; }
        .scale-mid { position: absolute; width: 24px; height: 2px; background: #888; left: -6px; top: 124px; }
        .pointer { width: 30px; height: 4px; background: #ffff00; position: absolute; left: -9px; transition: top 0.1s linear; }
    </style>
</head>
<body>

<div id="container">
    <div id="L1" class="light active-green" style="top: 30px; left: 160px;"></div>
    <div id="L2" class="light-off" style="top: 30px; left: 280px;"></div>
    <div class="label" style="top: 75px; left: 160px; width: 60px;">F1</div>
    <div class="label" style="top: 75px; left: 280px; width: 60px;">F2</div>

    <div id="track1" class="scale-track" style="top: 130px; left: 100px;"><div class="scale-mid"></div><div id="P1" class="pointer" style="top: 123px;"></div></div>
    <div id="track2" class="scale-track" style="top: 130px; left: 200px;"><div class="scale-mid"></div><div id="P2" class="pointer" style="top: 123px;"></div></div>
    <div id="track3" class="scale-track" style="top: 130px; left: 300px;"><div class="scale-mid"></div><div id="P3" class="pointer" style="top: 123px;"></div></div>
    <div id="track4" class="scale-track" style="top: 130px; left: 400px;"><div class="scale-mid"></div><div id="P4" class="pointer" style="top: 123px;"></div></div>
    
    <div class="label" style="top: 390px; left: 80px; width: 50px;">F3</div>
    <div class="label" style="top: 390px; left: 180px; width: 50px;">F4</div>
    <div class="label" style="top: 390px; left: 280px; width: 50px;">F5</div>
    <div class="label" style="top: 390px; left: 380px; width: 50px;">F6</div>
</div>

<script>
    // State: 0-100 scale, 50 is center.
    let state = {
        L1: true,  // true = Green is ON (Normal)
        L2: false, // false = Red is OFF (Normal)
        scales: [50, 50, 50, 50],
        offsets: [0, 0, 0, 0] // Drifts for anomalies
    };

    function update() {
        // Normal "Jitter" for scales
        for(let i=0; i<4; i++) {
            let jitter = (Math.random() - 0.5) * 4;
            let currentPos = 50 + state.offsets[i] + jitter;
            state.scales[i] = Math.max(0, Math.min(100, currentPos));
        }

        // Randomly trigger anomalies
        if (Math.random() < 0.003) {
            let r = Math.floor(Math.random() * 6);
            if (r === 0) state.L1 = false; // Green goes OFF
            if (r === 1) state.L2 = true;  // Red goes ON
            if (r >= 2) state.offsets[r-2] = (Math.random() > 0.5 ? 40 : -40); // Scale drifts
        }
        render();
    }

    function render() {
        // Lights: F1 (Normal=Green), F2 (Normal=Red Off)
        document.getElementById('L1').className = state.L1 ? 'light active-green' : 'light-off';
        document.getElementById('L2').className = state.L2 ? 'light active-red' : 'light-off';

        // Scales
        for(let i=0; i<4; i++) {
            // Map 0-100 to 0-246px top value
            let pixelPos = (state.scales[i] / 100) * 246;
            document.getElementById(`P${i+1}`).style.top = pixelPos + 'px';
        }
    }

    window.addEventListener('keydown', (e) => {
        const key = e.key.toUpperCase();
        let hit = false;

        if (key === 'a' && !state.L1) { state.L1 = true; hit = true; }
        if (key === 's' && state.L2) { state.L2 = false; hit = true; }
        if (key === 'd') { if(Math.abs(state.offsets[0]) > 10) hit = true; state.offsets[0] = 0; }
        if (key === 'f') { if(Math.abs(state.offsets[1]) > 10) hit = true; state.offsets[1] = 0; }
        if (key === 'g') { if(Math.abs(state.offsets[2]) > 10) hit = true; state.offsets[2] = 0; }
        if (key === 'h') { if(Math.abs(state.offsets[3]) > 10) hit = true; state.offsets[3] = 0; }

        if (hit) {
            window.parent.postMessage({ type: 'MATB_HIT', key: key, time: Date.now() }, '*');
        }
    });

    setInterval(update, 100);
</script>
</body>
</html>
